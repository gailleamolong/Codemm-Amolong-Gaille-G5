{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Edit profile</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
    {% for field in form %}{% include "includes/field.html" %}{% endfor %}
    <div class="actions">
      <button type="submit">Save changes</button>
      <a class="button secondary" href="{% url 'profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
