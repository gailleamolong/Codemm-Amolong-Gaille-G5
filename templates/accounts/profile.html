{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="head">
  <h1>Profile</h1>
  <a class="btn secondary" href="{% url 'profile_edit' %}">Edit</a>
</div>
<div class="card">
  <dl class="details">
    <dt>Name</dt><dd>{{ user.get_full_name|default:"–" }}</dd>
    <dt>Username</dt><dd>{{ user.username }}</dd>
    <dt>Email</dt><dd>{{ user.email }}</dd>
    <dt>ID number</dt><dd>{{ user.id_number|default:"–" }}</dd>
    <dt>Role</dt><dd>{{ user.get_role_display }}</dd>
  </dl>
</div>
{% endblock %}
