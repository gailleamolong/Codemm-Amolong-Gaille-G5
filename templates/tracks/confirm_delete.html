{% extends "base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<h1>Delete {{ object }}?</h1>
<p class="muted">This can't be undone.</p>
<form method="post" class="actions">
  {% csrf_token %}
  <button type="submit" class="btn danger">Delete</button>
  <a class="btn secondary" href="{% url 'track_list' %}">Cancel</a>
</form>
{% endblock %}
