{% extends "base.html" %}
{% block title %}Edit user{% endblock %}
{% block content %}
<h1>{{ object.get_full_name|default:object.username }}</h1>
<div class="card">
  <form method="post" class="stack">
    {% csrf_token %}
    {% include "includes/field.html" with field=form.role %}
    <label class="check">{{ form.is_active }} Active</label>
    <div class="actions">
      <button type="submit" class="btn">Save</button>
      <a class="btn secondary" href="{% url 'admin_dashboard' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
