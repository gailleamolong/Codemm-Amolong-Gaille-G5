{% extends "base.html" %}
{% block title %}Delete review{% endblock %}
{% block content %}
<h1>Delete your review?</h1>
<p class="muted">This can't be undone.</p>
<form method="post" class="actions">
  {% csrf_token %}
  <button type="submit" class="btn danger">Delete</button>
  <a class="btn secondary" href="{% url 'review_update' object.pk %}">Cancel</a>
</form>
{% endblock %}
